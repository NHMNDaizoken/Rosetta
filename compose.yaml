services:
  database:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: rosetta_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run npm run setup first}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?Run npm run setup first}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Run npm run setup first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rosetta_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [identity, data, workflow]
  identity:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/rosetta_identity
      KC_DB_USERNAME: rosetta_identity
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run npm run setup first}
      KC_BOOTSTRAP_ADMIN_USERNAME: rosetta-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run npm run setup first}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: ${PUBLIC_URL:-http://127.0.0.1:8080}/identity
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      CORE_CLIENT_SECRET: ${CORE_CLIENT_SECRET:?Run npm run setup first}
      TENANT_A_SECRET: ${TENANT_A_SECRET:?Run npm run setup first}
      TENANT_B_SECRET: ${TENANT_B_SECRET:?Run npm run setup first}
      READER_SECRET: ${READER_SECRET:?Run npm run setup first}
      SSO_USER_PASSWORD: ${SSO_USER_PASSWORD:?Run npm run setup first}
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /identity/health/ready HTTP/1.0\r\n\r\n" >&3; head -n1 <&3 | grep -q "200"''']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [identity]
  data-migrate:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    entrypoint: [sh, /migrations/migrate.sh]
    command: [-h, database, -U, rosetta_admin, -d, rosetta_data, -v, ON_ERROR_STOP=1]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes:
      - ./infra/postgres/migrate.sh:/migrations/migrate.sh:ro
      - ./infra/postgres/001-data.sql:/migrations/001-data.sql:ro
      - ./infra/postgres/002-workflow-requests.sql:/migrations/002-workflow-requests.sql:ro
      - ./infra/postgres/003-applications.sql:/migrations/003-applications.sql:ro
      - ./infra/postgres/004-resource-authorization.sql:/migrations/004-resource-authorization.sql:ro
      - ./infra/postgres/005-audit-protection.sql:/migrations/005-audit-protection.sql:ro
      - ./infra/postgres/006-capability-registry.sql:/migrations/006-capability-registry.sql:ro
      - ./infra/postgres/007-direct-trust.sql:/migrations/007-direct-trust.sql:ro
      - ./infra/postgres/008-trust-lifecycle.sql:/migrations/008-trust-lifecycle.sql:ro
      - ./infra/postgres/009-authorized-discovery.sql:/migrations/009-authorized-discovery.sql:ro
      - ./infra/postgres/010-capability-execution.sql:/migrations/010-capability-execution.sql:ro
      - ./infra/postgres/011-execution-finalization.sql:/migrations/011-execution-finalization.sql:ro
      - ./infra/postgres/012-composition.sql:/migrations/012-composition.sql:ro
      - ./infra/postgres/013-composition-authority.sql:/migrations/013-composition-authority.sql:ro
      - ./infra/postgres/014-composition-registry-guards.sql:/migrations/014-composition-registry-guards.sql:ro
      - ./infra/postgres/015-composition-reservation.sql:/migrations/015-composition-reservation.sql:ro
      - ./infra/postgres/016-composition-finalization.sql:/migrations/016-composition-finalization.sql:ro
      - ./infra/postgres/017-composition-exact-grants.sql:/migrations/017-composition-exact-grants.sql:ro
    depends_on:
      database:
        condition: service_healthy
    networks: [data]
  data:
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    environment:
      PGRST_DB_URI: postgres://rosetta_data:${DATA_DB_PASSWORD:?Run npm run setup first}@database:5432/rosetta_data
      PGRST_DB_SCHEMAS: core
      PGRST_JWT_SECRET: ${DATA_JWT_SECRET:?Run npm run setup first}
      PGRST_JWT_AUD: rosetta-data
      PGRST_DB_MAX_ROWS: "100"
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    networks: [data]
  objects:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [server, -dir=/data, -ip=objects, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=64, -volume.max=4, -filer]
    volumes:
      - object-data:/data
      - ./infra/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro
    networks: [objects]
  clamav:
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    environment:
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks: [scanner]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 2G
    # Internal only: no published ports. Signature updates use FreshClam inside the image.
  secrets:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-config=/openbao/config/local.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/data
      - ./infra/openbao/local.hcl:/openbao/config/local.hcl:ro
    networks: [secrets]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8200/v1/sys/health?standbyok=true 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # Internal only: no published ports. Init/unseal tokens stay outside Git.
  secrets-init:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/scripts/init-openbao.sh"]
    environment:
      BAO_ADDR: http://secrets:8200
      OPERATOR_DIR: /operator
      TOKEN_DIR: /token
    volumes:
      - openbao-operator:/operator
      - openbao-init:/token
      - ./scripts/init-openbao.sh:/scripts/init-openbao.sh:ro
      - ./infra/openbao/rosetta-core.hcl:/policy/rosetta-core.hcl:ro
    depends_on:
      secrets:
        condition: service_healthy
    networks: [secrets]
    restart: "no"
  workflow:
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/rosetta_workflow
      SPRING_DATASOURCE_USERNAME: rosetta_workflow
      SPRING_DATASOURCE_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Run npm run setup first}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      FLOWABLE_REST_APP_ADMIN_USERID: rosetta-engine
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${WORKFLOW_ADMIN_PASSWORD:?Run npm run setup first}
      FLOWABLE_REST_APP_CREATEDEMODEFINITIONS: "false"
      FLOWABLE_REST_APP_SWAGGERDOCSENABLED: "false"
      FLOWABLE_HISTORYLEVEL: full
      JAVA_OPTS: -Xms128m -Xmx512m
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          auth=$$(printf 'rosetta-engine:%s' "$$FLOWABLE_REST_APP_ADMIN_PASSWORD" | base64 | tr -d '\n');
          wget -q -O /dev/null --header="Authorization: Basic $$auth"
          http://127.0.0.1:8080/flowable-rest/service/management/engine
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks: [workflow]
  workflow-init:
    image: rosetta-core:local
    pull_policy: never
    command: [node, scripts/init-workflows.mjs]
    environment:
      WORKFLOW_URL: http://workflow:8080/flowable-rest/service
      WORKFLOW_ADMIN_PASSWORD: ${WORKFLOW_ADMIN_PASSWORD:?Run npm run setup first}
    volumes:
      - ./infra/flowable/checkpoint.bpmn20.xml:/definitions/checkpoint.bpmn20.xml:ro
    depends_on:
      workflow:
        condition: service_healthy
    networks: [workflow]
  core:
    build: .
    image: rosetta-core:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OIDC_ISSUER: ${PUBLIC_URL:-http://127.0.0.1:8080}/identity/realms/rosetta
      IDENTITY_URL: http://identity:8080/identity/realms/rosetta
      CORE_CLIENT_SECRET: ${CORE_CLIENT_SECRET:?Run npm run setup first}
      DATA_URL: http://data:3000
      DATA_JWT_SECRET: ${DATA_JWT_SECRET:?Run npm run setup first}
      LEGACY_RESOURCE_CLIENTS: ${LEGACY_RESOURCE_CLIENTS-tenant-a,tenant-b,reader}
      OBJECTS_URL: http://objects:8888
      OBJECTS_MASTER_URL: http://objects:9333
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      SECRETS_URL: http://secrets:8200
      SECRETS_TOKEN_FILE: /run/rosetta/core-token
      SECRETS_MOUNT: ${SECRETS_MOUNT:-secret}
      WORKFLOW_URL: http://workflow:8080/flowable-rest/service
      WORKFLOW_ADMIN_PASSWORD: ${WORKFLOW_ADMIN_PASSWORD:?Run npm run setup first}
      C4A_ENABLED: ${C4A_ENABLED:-false}
      C4A_PROVIDER_ORIGINS: ${C4A_PROVIDER_ORIGINS:-[]}
      C4B_ENABLED: ${C4B_ENABLED:-false}
      C4B_PROVIDER_ORIGINS: ${C4B_PROVIDER_ORIGINS:-[]}
    depends_on:
      identity:
        condition: service_healthy
      data:
        condition: service_started
      objects:
        condition: service_started
      clamav:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      workflow-init:
        condition: service_completed_successfully
    read_only: true
    volumes:
      - openbao-init:/run/rosetta:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
    networks: [identity, data, objects, scanner, secrets, workflow, edge]
  gateway:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, identity]
  console:
    profiles: ["console"]
    image: rosetta-console:local
    build:
      context: .
      dockerfile: console/Dockerfile
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 5s
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [edge]

networks:
  edge:
  identity:
    internal: true
  data:
    internal: true
  objects:
    internal: true
  scanner:
    internal: true
  secrets:
    internal: true
  workflow:
    internal: true

volumes:
  postgres-data:
  object-data:
  clamav-signatures:
  openbao-data:
  openbao-operator:
  openbao-init:
