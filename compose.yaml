services:
  core:
    build: .
    image: rosetta-core:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
