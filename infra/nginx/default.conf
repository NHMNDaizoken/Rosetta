limit_req_zone $binary_remote_addr zone=core_limit:10m rate=100r/s;
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    access_log off;
    client_max_body_size 10m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Request-ID $request_id always;

    location = /health { proxy_pass http://core:8080; }
    location = /ready { proxy_pass http://core:8080; }
    location /identity/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://identity:8080;
    }
    location = /_authorize {
        internal;
        proxy_pass http://core:8080/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location /v1/ {
        error_page 500 = @identity_unavailable;
        limit_req zone=core_limit burst=50 nodelay;
        auth_request /_authorize;
        proxy_pass http://core:8080;
        proxy_set_header X-Request-ID $request_id;
    }
    location @identity_unavailable { default_type application/json; return 503 '{"error":"identity_unavailable"}'; }
    location / { default_type application/json; return 404 '{"error":"not_found"}'; }
}
