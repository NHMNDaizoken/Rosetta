server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway "gateway:8080";

    if ($request_uri ~* "^[^?]*%(2e|2f|25|5c|00|3f|23)") {
        return 400;
    }
    if ($request_uri ~ "^[^?]*//") {
        return 400;
    }
    if ($request_uri ~ "^[^?]*(/\.\.?)(/|$)") {
        return 400;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    location = /api/health {
        if ($request_method != GET) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api/ready {
        if ($request_method != GET) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api/v1/identity {
        if ($request_method != GET) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location ~ "^/api/v1/applications/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        if ($request_method != GET) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location ~ "^/api/v1/applications/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(approve|state)$" {
        if ($request_method != POST) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api/v1/applications {
        if ($request_method != POST) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api/v1/approvals {
        if ($request_method != POST) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api/v1/workflows/definitions {
        if ($request_method != GET) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api/v1/workflows/executions {
        if ($request_method != POST) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location ~ "^/api/v1/workflows/executions/[A-Za-z0-9:_-]{1,128}/complete$" {
        if ($request_method != POST) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location ~ "^/api/v1/workflows/executions/[A-Za-z0-9:_-]{1,128}$" {
        if ($request_method !~ ^(GET|DELETE)$) {
            return 405;
        }
        include /etc/nginx/snippets/console-proxy.conf;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:js|css|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location = /favicon.svg {
        expires 1h;
    }

    location / {
        if ($http_accept !~* "text/html") {
            return 404;
        }
        try_files $uri $uri/ /index.html;
    }
}
