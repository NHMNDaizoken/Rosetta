name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check source syntax
        run: npm run check
      - name: Install Console dependencies
        run: npm ci --prefix console
      - name: Verify generated Console endpoint inventory
        run: npm run console:check:endpoints
      - name: Test and build Console
        run: |
          npm run console:test
          npm run console:build
      - name: Build and contract-test packaged Console
        run: npm run test:console-container
      - name: Install development-only contract validators
        run: python -m pip install -r requirements-contracts.txt
      - name: Validate implemented OpenAPI and validator regression controls
        run: |
          npm run check:contracts
          npm run test:contract-validator
      - name: Test HTTP contract and startup validation
        run: npm test
      - name: Verify guarded provider transport with host OpenSSL
        run: npm run test:provider-network
      - name: Verify fresh private execution authority and audit rollback
        run: npm run test:execution-ledger
      - name: Verify migration checksums, drift detection and concurrent runners
        run: npm run test:migrations
      - name: Validate Compose configuration
        run: |
          npm run setup
          docker compose config --quiet
      - name: Build and start the local container
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Probe host and container endpoints
        run: |
          npm run healthcheck
          docker compose exec -T core node scripts/check-health.mjs
      - name: Run HTTP tests in the pinned container runtime
        run: docker compose run --rm --no-deps --volume "$PWD/tests:/app/tests:ro" --volume "$PWD/docs/contracts/examples:/app/docs/contracts/examples:ro" core node --test
      - name: Verify real Core integrations
        run: npm run test:integration
      - name: Verify registration, guarded capability invocation, resource isolation and Flowable worker
        run: |
          npm run test:applications
          npm run test:capabilities
          npm run test:flowable-worker
      - name: Verify isolated backup and restore with tenant RLS
        run: npm run test:recovery
      - name: Verify protected audit boundary, redaction and persistence
        run: npm run test:audit
      - name: Collect container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
